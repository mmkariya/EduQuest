
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/dark-mode.css">
    <script src="js/theme.js"></script>
    <title>Login | EduQuest</title>
    <style>
        :root {
            --bg-1: #f6f3ff;
            --bg-2: #edf5ff;
            --purple: #684cf8;
            --purple-dark: #4f39d4;
            --blue: #4b8df7;
            --card: rgba(255, 255, 255, 0.82);
            --text: #201a3e;
            --muted: #6d6886;
            --line: rgba(110, 89, 255, 0.12);
            --shadow: 0 22px 55px rgba(77, 58, 161, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(104, 76, 248, 0.18), transparent 32%),
                radial-gradient(circle at bottom right, rgba(75, 141, 247, 0.16), transparent 30%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            color: var(--text);
            padding: 24px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            backdrop-filter: blur(12px);
            padding: 32px 28px;
            border-radius: 26px;
            width: min(420px, 100%);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: rgba(104, 76, 248, 0.08);
            right: -60px;
            top: -80px;
        }

        h1 {
            color: var(--purple);
            margin: 0 0 8px;
            font-size: clamp(2rem, 3vw, 2.7rem);
            position: relative;
            z-index: 1;
        }

        .card p {
            color: var(--muted);
            position: relative;
            z-index: 1;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 14px 16px;
            margin-top: 14px;
            border-radius: 14px;
            font-size: 16px;
            border: 1px solid rgba(113, 94, 196, 0.14);
            position: relative;
            z-index: 1;
        }

        input {
            background: rgba(255,255,255,0.8);
            color: var(--text);
        }

        input:focus {
            outline: 3px solid rgba(104, 76, 248, 0.12);
            border-color: var(--purple);
        }

        button {
            border: 0;
            background: linear-gradient(135deg, var(--purple), var(--blue));
            color: white;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 16px 26px rgba(104, 76, 248, 0.22);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 30px rgba(104, 76, 248, 0.28);
        }

        #message {
            color: #b42318;
            min-height: 24px;
            margin-top: 14px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        a {
            color: var(--purple);
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Welcome Back!</h1>
        <p>Login to continue your quest.</p>

        <form id="login-form">
            <input
                id="email"
                type="email"
                placeholder="Email address"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <p id="message" role="alert"></p>

        <p>Don't have an account?
            <a href="register.html">Register here</a>
        </p>
    </main>

    <script src="js/auth.js"></script>
    <script>
        const form = document.getElementById("login-form");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            message.textContent = "";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || 'Login failed.');
                }

                const user = data && data.user ? data.user : null;
                if (user) {
                    const normalizedUser = {
                        id: user.id,
                        name: user.name,
                        email: user.email,
                        category: user.category || 'Elementary'
                    };

                    localStorage.setItem('eduquestCurrentUser', JSON.stringify(normalizedUser));
                    localStorage.setItem('eduquestSession', JSON.stringify({ userId: user.id }));
                    localStorage.setItem('eduquestDemoSession', JSON.stringify({ userId: user.id }));
                }

                const returnTo = new URLSearchParams(window.location.search).get('returnTo');
                window.location.href = returnTo === 'settings.html' ? returnTo : 'index.html';
            } catch (error) {
                message.textContent = error.message;
            }
        });
    </script>
</body>
</html>
