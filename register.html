
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/dark-mode.css">
  <script src="js/theme.js"></script>
  <title>EduQuest | Create Account</title>
  <style>
    :root {
      --bg-1: #f6f3ff;
      --bg-2: #edf5ff;
      --purple: #684cf8;
      --purple-dark: #4f39d4;
      --blue: #4b8df7;
      --card: rgba(255, 255, 255, 0.82);
      --text: #1f1b39;
      --muted: #6f6a85;
      --line: rgba(104, 76, 248, 0.12);
      --shadow: 0 22px 55px rgba(77, 58, 161, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(104, 76, 248, 0.18), transparent 32%),
        radial-gradient(circle at bottom right, rgba(75, 141, 247, 0.16), transparent 30%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }

    .register-card {
      width: 100%;
      max-width: 540px;
      padding: 42px 37px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .register-card::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(104, 76, 248, 0.08);
      right: -60px;
      top: -80px;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--purple);
      font-size: clamp(2.2rem, 3vw, 2.8rem);
      position: relative;
      z-index: 1;
    }

    .subtitle {
      margin: 0 0 28px;
      font-size: 19px;
      color: var(--muted);
      position: relative;
      z-index: 1;
    }

    input, select {
      width: 100%;
      min-height: 55px;
      margin-bottom: 14px;
      padding: 13px 15px;
      border: 1px solid rgba(113, 94, 196, 0.14);
      border-radius: 14px;
      background: rgba(255,255,255,0.8);
      font-size: 17px;
      color: var(--text);
      position: relative;
      z-index: 1;
    }

    input:focus, select:focus {
      outline: 3px solid rgba(104, 76, 248, 0.12);
      border-color: var(--purple);
    }

    select {
      color: var(--muted);
      cursor: pointer;
    }

    button {
      width: 100%;
      min-height: 54px;
      margin-top: 6px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 16px 26px rgba(104, 76, 248, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      z-index: 1;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 30px rgba(104, 76, 248, 0.28);
    }

    .login-text {
      margin-top: 20px;
      font-size: 17px;
      line-height: 1.5;
      position: relative;
      z-index: 1;
    }

    .login-text a { color: var(--purple); font-weight: 700; }

    #message {
      margin-top: 14px;
      font-size: 15px;
      overflow-wrap: anywhere;
      position: relative;
      z-index: 1;
      min-height: 24px;
    }

    @media (max-width: 480px) {
      .register-card { padding: 30px 22px; }
      h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <main class="register-card">
    <h1>Create Account</h1>
    <p class="subtitle">Join the EduQuest adventure!</p>

    <form id="registerForm">
      <input
        type="text"
        id="playerName"
        placeholder="Player name"
        autocomplete="name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <select id="category" required>
        <option value="" disabled selected>Select your category</option>
        <option value="Elementary">Elementary</option>
        <option value="High School">High School</option>
        <option value="College (IT)">College (IT)</option>
      </select>

      <input
        type="password"
        id="password"
        placeholder="Password (8+ characters)"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button type="submit" id="registerButton">Register</button>
      <p id="message" role="status"></p>
    </form>

    <p class="login-text">
      Already have an account?
      <a href="login.html">Login here</a>
    </p>
  </main>

  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const registerButton = document.getElementById("registerButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const name = document.getElementById("playerName").value.trim();
      const email = document.getElementById("email").value.trim();
      const category = document.getElementById("category").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      message.style.color = "#c62828";

      if (!name || !email || !category || !password || !confirmPassword) {
        message.textContent = "Please complete all fields.";
        return;
      }

      if (password.length < 8) {
        message.textContent = "Your password must be at least 8 characters.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      try {
        registerButton.disabled = true;
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, category })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.message || 'Unable to create account.');
        }

        message.style.color = "#16834a";
        message.textContent = "Account created! Redirecting to your dashboard...";
        setTimeout(() => {
          window.location.href = "login.html";
        }, 800);
      } catch (error) {
        message.textContent = error.message || "Unable to create account.";
        registerButton.disabled = false;
      }
    });
  </script>
</body>
</html>
