<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduQuest - Rewards</title>

    <style>
        :root {
            --purple: #6c4dff;
            --purple-dark: #5438d6;
            --blue: #4d8bff;
            --yellow: #ffd93d;
            --white: #ffffff;
            --bg: #f5f3ff;
            --text: #25213b;
            --muted: #77738b;
            --green: #4caf50;
            --border: #e6e2f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: white;
            border-right: 1px solid var(--border);
            padding: 25px 15px;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 15px 30px;
            font-size: 22px;
            font-weight: 700;
            color: var(--purple);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--purple);
            color: white;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .nav a {
            display: flex;
            align-items: center;
            gap: 13px;
            text-decoration: none;
            color: #68647a;
            padding: 13px 15px;
            border-radius: 12px;
            font-size: 15px;
            transition: 0.2s;
            cursor: pointer;
        }

        .nav a:hover {
            background: #f0edff;
            color: var(--purple);
        }

        .nav a.active {
            background: var(--purple);
            color: white;
        }

        .nav-icon {
            width: 22px;
            text-align: center;
            font-size: 18px;
        }

        /* ================= MAIN ================= */

        .main {
            margin-left: 250px;
            padding: 35px 45px;
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .page-title h1 {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .page-title p {
            color: var(--muted);
        }

        /* XP CARD */

        .xp-card {
            background: linear-gradient(
                135deg,
                var(--purple),
                var(--blue)
            );
            color: white;
            padding: 20px 25px;
            border-radius: 18px;
            min-width: 190px;
            box-shadow: 0 8px 25px rgba(108, 77, 255, 0.2);
        }

        .xp-label {
            font-size: 13px;
            opacity: 0.85;
        }

        .xp-number {
            font-size: 30px;
            font-weight: 700;
            margin-top: 4px;
        }

        /* ================= REWARDS ================= */

        .section-title {
            margin-bottom: 18px;
            font-size: 21px;
        }

        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(230px, 1fr)
            );
            gap: 20px;
        }

        .reward-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            border: 1px solid var(--border);
            transition: 0.25s;
            position: relative;
        }

        .reward-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(50, 40, 100, 0.1);
        }

        .reward-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            background: #f0edff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            margin-bottom: 18px;
        }

        .reward-card h3 {
            font-size: 19px;
            margin-bottom: 8px;
        }

        .reward-card p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            min-height: 42px;
        }

        .reward-cost {
            margin-top: 18px;
            font-weight: 700;
            color: var(--purple);
            font-size: 15px;
        }

        .redeem-btn {
            width: 100%;
            border: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 10px;
            background: var(--purple);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .redeem-btn:hover {
            background: var(--purple-dark);
        }

        .redeem-btn:disabled {
            background: #d8d5e4;
            color: #858194;
            cursor: not-allowed;
        }

        /* ================= HISTORY ================= */

        .history-section {
            margin-top: 40px;
        }

        .history {
            background: white;
            border-radius: 18px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 17px 22px;
            border-bottom: 1px solid var(--border);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-name {
            font-weight: 600;
        }

        .history-date {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-top: 4px;
        }

        .history-xp {
            color: #e04b4b;
            font-weight: 700;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: var(--muted);
        }

        /* ================= NOTIFICATION ================= */

        .notification {
            position: fixed;
            right: 25px;
            bottom: 25px;
            background: #25213b;
            color: white;
            padding: 15px 22px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: 0.3s;
            z-index: 999;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 800px) {

            .sidebar {
                width: 75px;
                padding: 20px 10px;
            }

            .logo span,
            .nav a span:not(.nav-icon) {
                display: none;
            }

            .logo {
                justify-content: center;
                padding-left: 0;
                padding-right: 0;
            }

            .nav a {
                justify-content: center;
            }

            .main {
                margin-left: 75px;
                padding: 25px 20px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .xp-card {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">E</div>
            <span>EduQuest</span>
        </div>

        <nav class="nav">

            <a href="index.html">
                <span class="nav-icon">🏠</span>
                <span>Dashboard</span>
            </a>

            <a href="profile.html">
                <span class="nav-icon">👤</span>
                <span>Profile</span>
            </a>

            <a href="quests.html">
                <span class="nav-icon">🎯</span>
                <span>Quests</span>
            </a>

            <!-- REWARDS -->
            <a href="rewards.html" class="active">
                <span class="nav-icon">🎁</span>
                <span>Rewards</span>
            </a>

            <a href="badges.html">
                <span class="nav-icon">🏅</span>
                <span>Badges</span>
            </a>

        </nav>

    </aside>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main">

        <div class="topbar">

            <div class="page-title">
                <h1>Rewards</h1>
                <p>Use your earned XP to redeem exciting rewards.</p>
            </div>

            <div class="xp-card">
                <div class="xp-label">Your XP</div>
                <div class="xp-number">
                    ⭐ <span id="xp-value">0</span> XP
                </div>
            </div>

        </div>


        <!-- REWARDS -->

        <h2 class="section-title">Available Rewards</h2>

        <div
            id="rewards-container"
            class="rewards-grid">
        </div>


        <!-- HISTORY -->

        <section class="history-section">

            <h2 class="section-title">
                Redemption History
            </h2>

            <div
                id="reward-history"
                class="history">
            </div>

        </section>

    </main>


    <!-- NOTIFICATION -->

    <div
        id="notification"
        class="notification">
    </div>


    <!-- JAVASCRIPT -->

    <script src="js/rewards.js"></script>

</body>
</html>
