<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduQuest - Rewards</title>

    <style>
        :root {
            --purple: #6c4dff;
            --purple-dark: #5438d6;
            --purple-light: #8b73ff;
            --blue: #4d8bff;
            --yellow: #ffd93d;
            --white: #f9f7ff;
            --bg: #f5f3ff;
            --text: #25213b;
            --muted: #77738b;
            --green: #4caf50;
            --border: #e6e2f5;
            --shadow: 0 8px 24px rgba(108, 77, 255, 0.12);
            --shadow-sm: 0 4px 14px rgba(108, 77, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 85% 10%, rgba(108, 77, 255, 0.08), transparent 45%),
                radial-gradient(circle at 10% 90%, rgba(77, 139, 255, 0.08), transparent 45%);
            pointer-events: none;
            z-index: 0;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: linear-gradient(180deg, var(--purple) 0%, var(--purple-dark) 100%);
            color: white;
            padding: 30px 20px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .logo {
            font-size: 28px;
            margin-bottom: 40px;
            text-align: center;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            color: white;
            white-space: nowrap;
        }

        .logo-text {
            color: #ffffff;
        }

        .logo-highlight {
            color: #ffd93d;
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .sidebar .nav-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.5;
            transition: background 0.2s, transform 0.2s;
            cursor: pointer;
            pointer-events: auto;
        }

        .sidebar .nav-item:hover {
            background: rgba(255, 255, 255, 0.16);
            color: white;
            transform: translateX(3px);
        }

        .sidebar .nav-item.active {
            background: white;
            color: var(--purple);
            font-weight: 700;
            box-shadow: var(--shadow-sm);
        }

        .sidebar .nav-item.active:hover {
            color: var(--purple);
        }

        .main {
            position: relative;
            z-index: 1;
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 35px 45px;
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
            margin-bottom: 35px;
        }

        .page-title h1 {
            font-size: 30px;
            margin-bottom: 5px;
            color: var(--text);
        }

        .page-title p {
            color: var(--muted);
        }

        .xp-card {
            background: linear-gradient(135deg, var(--purple), var(--blue));
            color: white;
            padding: 20px 25px;
            border-radius: 18px;
            min-width: 245px;
            box-shadow: 0 8px 25px rgba(108, 77, 255, 0.2);
            flex-shrink: 0;
        }

        .xp-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .xp-number {
            font-size: 30px;
            font-weight: 700;
            margin-top: 4px;
            white-space: nowrap;
        }

        .section-title {
            margin-bottom: 18px;
            font-size: 21px;
            color: var(--text);
        }

        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
        }

        .reward-card {
            background: white;
            border-radius: 22px;
            padding: 30px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 14px rgba(108, 77, 255, 0.04);
            transition: 0.25s;
            position: relative;
            min-width: 0;
        }

        .reward-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(50, 40, 100, 0.1);
        }

        .reward-icon {
            width: 90px;
            height: 90px;
            border-radius: 22px;
            background: #f0edff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            margin-bottom: 22px;
        }

        .reward-card h3 {
            font-size: 22px;
            margin-bottom: 10px;
            color: var(--text);
        }

        .reward-card p {
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
            min-height: 50px;
        }

        .reward-cost {
            margin-top: 20px;
            font-weight: 700;
            color: var(--purple);
            font-size: 18px;
        }

        .redeem-btn {
            width: 100%;
            border: none;
            padding: 14px;
            margin-top: 18px;
            border-radius: 12px;
            background: var(--purple);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .redeem-btn:hover:not(:disabled) {
            background: var(--purple-dark);
        }

        .redeem-btn:disabled {
            background: #d8d5e4;
            color: #858194;
            cursor: not-allowed;
        }

        .history-section {
            margin-top: 40px;
        }

        .history {
            background: white;
            border-radius: 18px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 17px 22px;
            border-bottom: 1px solid var(--border);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-name {
            font-weight: 600;
        }

        .history-date {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-top: 4px;
        }

        .history-xp {
            color: #e04b4b;
            font-weight: 700;
            white-space: nowrap;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: var(--muted);
        }

        .notification {
            position: fixed;
            right: 25px;
            bottom: 25px;
            background: #25213b;
            color: white;
            padding: 15px 22px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: 0.3s;
            z-index: 999;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 900px) {
            .main {
                padding: 30px 25px;
            }

            .topbar {
                align-items: flex-start;
            }

            .xp-card {
                min-width: 190px;
            }

            .rewards-grid {
                grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            }
        }

        @media (max-width: 700px) {
            .sidebar {
                top: auto;
                bottom: 0;
                left: 0;
                width: 100%;
                height: auto;
                min-height: 0;
                padding: 8px 5px;
                overflow: visible;
            }

            .logo {
                display: none;
            }

            .sidebar nav {
                flex-direction: row;
                justify-content: space-around;
                align-items: stretch;
                gap: 2px;
            }

            .sidebar .nav-item {
                flex: 1;
                flex-direction: column;
                justify-content: center;
                gap: 3px;
                padding: 8px 2px;
                border-radius: 8px;
                font-size: 10px;
                text-align: center;
                transform: none;
                white-space: nowrap;
            }

            .sidebar .nav-item:hover {
                transform: none;
            }

            .main {
                margin-left: 0;
                margin-bottom: 80px;
                width: 100%;
                padding: 25px 18px;
            }

            .topbar {
                flex-direction: column;
                align-items: stretch;
                gap: 20px;
                margin-bottom: 28px;
            }

            .page-title h1 {
                font-size: 27px;
            }

            .xp-card {
                width: 100%;
                min-width: 0;
            }

            .rewards-grid {
                grid-template-columns: 1fr;
            }

            .reward-card {
                padding: 24px;
            }

            .history-item {
                padding: 15px;
            }

            .notification {
                right: 15px;
                bottom: 85px;
                left: 15px;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <h1 class="logo"><span class="logo-text">Edu</span><span class="logo-highlight">Quest</span></h1>

        <nav>
            <a href="index.html" class="nav-item">🏠 Dashboard</a>
            <a href="profile.html" class="nav-item">🧙 Profile</a>
            <a href="quests.html" class="nav-item">🗺️ Quests</a>
            <a href="rewards.html" class="nav-item active">🏆 Rewards</a>
            <a href="badges.html" class="nav-item">🏅 Badges</a>
            <a href="progress.html" class="nav-item">📊 Progress</a>
            <a href="settings.html" class="nav-item">⚙️ Settings</a>
        </nav>
    </aside>

    <main class="main">
        <div class="topbar">
            <div class="page-title">
                <h1>Rewards</h1>
                <p>Use your earned XP to redeem exciting rewards.</p>
            </div>

            <div class="xp-card">
                <div class="xp-label">Your XP</div>
                <div class="xp-number">
                    ⭐ <span id="xp-value">0</span> XP
                </div>
            </div>
        </div>

        <h2 class="section-title">Available Rewards</h2>

        <div id="rewards-container" class="rewards-grid"></div>

        <section class="history-section">
            <h2 class="section-title">Redemption History</h2>
            <div id="reward-history" class="history"></div>
        </section>
    </main>

    <div id="notification" class="notification"></div>

    <script src="js/rewards.js"></script>
</body>
</html>
